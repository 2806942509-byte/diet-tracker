<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="饮食打卡">
<meta name="theme-color" content="#14263f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="data:,">
<title>饮食打卡 · 碳蛋脂热量记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#e7ecf2;
  --card:#e7ecf2;
  --dark:#c4ccd7;
  --light:#ffffff;
  --text:#3b4453;
  --muted:#7d8796;
  --accent:#4f93d0;
  --accent2:#6cc4a1;
  --danger:#e77f7f;
  --c:#4c8bf5;
  --p:#f47b4c;
  --f:#f0b44c;
  --k:#ef6f8e;
  --radius:26px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;      /* 关掉双击缩放，避免误触 */
  overscroll-behavior-y:none;
}
button,input,select,textarea{touch-action:manipulation}
/* 手机上输入框字号必须 ≥16px，否则 iOS 一点进去就自动放大整页 */
@media (max-width:1000px){
  input,select,textarea{font-size:16px !important}
}
.hidden{display:none !important}
.muted{color:var(--muted);font-size:13px}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:0 18px 70px}
.app-header{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:15px;padding:18px 24px 20px;margin:18px auto 20px;max-width:1320px;
}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.daybox{text-align:center;width:100%}
/* 日期一行：与全站同一套无衬线字体，日期加粗深墨色 + 周几做成软蓝胶囊（呼应界面里的圆角块） */
.day-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.day-label{
  font-size:clamp(22px,5.6vw,26px);
  font-weight:800;letter-spacing:.005em;line-height:1.12;
  color:#2b3648;
  font-variant-numeric:tabular-nums;
}
.day-week{
  font-size:12px;font-weight:700;letter-spacing:.06em;line-height:1;
  color:#4585c4;background:rgba(91,155,213,.16);
  padding:6px 12px;border-radius:999px;
  align-self:center;
}

/* ---------- neumorphic primitives ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:10px 10px 22px var(--dark),-10px -10px 22px var(--light);
  padding:22px;
}
.inset,.search,.qty-input,.serving-input,.field input,.field select,.weight-input,.weight-field input,.mult-input{
  background:var(--card);
  border:none;
  border-radius:14px;
  box-shadow:inset 4px 4px 9px var(--dark),inset -4px -4px 9px var(--light);
  color:var(--text);
  outline:none;
  transition:box-shadow .18s;
}
.search:focus,.qty-input:focus,.serving-input:focus,.field input:focus,.field select:focus,.weight-input:focus,.weight-field input:focus,.mult-input:focus{
  box-shadow:inset 4px 4px 9px var(--dark),inset -4px -4px 9px var(--light),0 0 0 2px rgba(79,147,208,.25);
}
.btn{
  border:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);
  background:var(--card);border-radius:14px;padding:9px 16px;
  box-shadow:5px 5px 11px var(--dark),-5px -5px 11px var(--light);
  transition:all .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);transform:translateY(0)}
.btn-primary{
  background:linear-gradient(145deg,#4b8fc9,#5da9e8);color:#fff;
  box-shadow:6px 6px 13px rgba(70,130,180,.38),-5px -5px 11px var(--light);
}
.btn-primary:active{box-shadow:inset 4px 4px 8px rgba(30,70,110,.45),inset -2px -2px 5px rgba(255,255,255,.2)}
.btn-ghost{color:var(--accent)}
.btn-danger-ghost{color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn-block{width:100%}

/* ---------- nav ---------- */
.main-nav{
  display:flex;gap:8px;max-width:560px;margin:0 auto 24px;padding:7px;
  border-radius:20px;background:var(--card);
  box-shadow:8px 8px 16px var(--dark),-8px -8px 16px var(--light);
}
.main-nav button{
  flex:1;border:none;background:transparent;cursor:pointer;padding:11px 10px;
  border-radius:14px;font-size:14.5px;font-weight:700;color:var(--muted);
  transition:all .2s;white-space:nowrap;
}
.main-nav button.active{
  color:var(--accent);background:var(--card);
  box-shadow:5px 5px 11px var(--dark),-5px -5px 11px var(--light);
}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- today ---------- */
.today-layout{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start}
.card-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.search{padding:10px 15px;font-size:13.5px;width:200px}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap}
.cat-filter-btn{
  border:none;background:transparent;cursor:pointer;padding:7px 12px;border-radius:11px;
  font-size:12.5px;font-weight:700;color:var(--muted);transition:all .15s;
}
.cat-filter-btn.active{color:var(--accent);background:var(--card);box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light)}
.seg{display:flex;padding:5px;border-radius:15px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}
.seg button{
  border:none;background:transparent;cursor:pointer;padding:8px 15px;border-radius:11px;
  font-size:13px;font-weight:700;color:var(--muted);transition:all .15s;
}
.seg button.active{color:var(--accent);background:var(--card);box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;padding:9px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 8px;text-align:right;border-top:1px solid rgba(59,68,83,.08);white-space:nowrap;vertical-align:middle}
tr.cat-head td{
  border:none;background:rgba(91,155,213,.10);color:var(--accent);
  font-weight:800;font-size:12.5px;padding:7px 10px;border-radius:10px;letter-spacing:1px;
}
.fname{font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fname:hover{color:var(--accent)}
.cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.carb{background:var(--c)}.protein{background:var(--p)}.other{background:var(--accent2)}
.qty{display:flex;align-items:center;gap:5px;justify-content:center}
.qty-input,.serving-input{width:76px;padding:8px 4px;text-align:center;font-size:13.5px;-moz-appearance:textfield}
.serving-input{width:70px;color:var(--accent);font-weight:700}
.qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button,
.serving-input::-webkit-inner-spin-button,.serving-input::-webkit-outer-spin-button{-webkit-appearance:none}
.step{
  width:30px;height:30px;border:none;border-radius:10px;cursor:pointer;background:var(--card);
  color:var(--accent);font-size:17px;font-weight:800;line-height:1;
  box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light);transition:all .12s;
}
.step:active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light)}
/* 表头与列内容对齐 */
th.col-serving,td.col-serving,th.col-qty,td.col-qty{text-align:center}
.empty-td{text-align:center !important;color:var(--muted);padding:30px 10px}
/* 手填营养素：强制单行，三个数字框平分剩余宽度 */
.manual-add{
  display:flex;flex-wrap:nowrap;align-items:center;gap:6px;margin:0 0 12px;
  padding:9px 12px;border-radius:16px;
  background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);
}
.manual-add-title{font-size:15px;line-height:1;flex:none}
.manual-add label{display:flex;align-items:center;gap:4px;flex:1 1 0;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap}
.manual-add input{
  flex:1 1 auto;width:100%;min-width:0;padding:8px 2px;text-align:center;font-size:14px;
  background:var(--card);border:none;border-radius:11px;color:var(--text);outline:none;
  box-shadow:inset 3px 3px 7px var(--dark),inset -3px -3px 7px var(--light);
}
.manual-add .btn{flex:none;white-space:nowrap;padding:9px 13px;font-size:13px}
.ver-line{margin-top:12px;text-align:center;font-size:10.5px;color:var(--muted);opacity:.75;letter-spacing:.05em}
.manual-del{color:var(--danger) !important}
/* 拍食物估算面板 */
.dish-panel{
  margin-bottom:12px;padding:12px 14px;border-radius:16px;
  background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);
}
.dish-name{font-size:15px;font-weight:800}
.dish-nums{font-size:12.5px;color:var(--muted);margin:6px 0 10px;line-height:1.6}
.dish-portion{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.dish-portion-title{font-size:12.5px;font-weight:700;color:var(--muted)}
.dish-g{
  border:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text);
  background:var(--card);border-radius:11px;padding:7px 11px;
  box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light);
}
.dish-g.active{color:#fff;background:linear-gradient(145deg,#4b8fc9,#5da9e8)}
.dish-actions{display:flex;flex-wrap:wrap;gap:9px}

/* ---------- overview ---------- */
.overview{position:sticky;top:18px}
.kcal-hero{padding:18px;border-radius:20px;background:var(--card);box-shadow:inset 5px 5px 10px var(--dark),inset -5px -5px 10px var(--light);margin-bottom:14px;text-align:center}
.kcal-num{font-size:44px;font-weight:800;color:var(--k);line-height:1.1}
.kcal-sub{font-size:13px;color:var(--muted);margin:5px 0 12px}
.bar{height:10px;border-radius:8px;background:var(--card);box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:width .3s ease;min-width:2px}
.fill-c{background:linear-gradient(90deg,#4c8bf5,#7db2ff)}
.fill-p{background:linear-gradient(90deg,#f47b4c,#ffa06b)}
.fill-f{background:linear-gradient(90deg,#f0b44c,#ffd17a)}
.fill-k{background:linear-gradient(90deg,#ef6f8e,#ff93ad)}
.metric-list{display:grid;gap:11px}
.metric-row{padding:11px 13px;border-radius:16px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}
.metric-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:13px}
.metric-name{font-weight:700;display:flex;align-items:center;gap:7px;min-width:64px}
.metric-name i{width:9px;height:9px;border-radius:50%;display:inline-block}
.metric-vals{color:var(--muted);font-size:12px}
.metric-vals b{color:var(--text)}
.metric-vals .gap{color:var(--accent2);font-weight:700;margin-left:6px}
.metric-vals .gap.over{color:var(--danger)}

/* ---------- library ---------- */
.library-layout{display:flex;flex-direction:column;gap:22px}

/* ---------- 联网查营养 ---------- */
.srch-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch-bar-2{margin-top:-4px;margin-bottom:12px}
.srch-input{flex:1 1 240px;min-width:170px;width:auto;padding:11px 14px;font-size:14px}
.srch-status{
  font-size:12.5px;line-height:1.65;margin-bottom:12px;padding:10px 14px;border-radius:14px;color:var(--muted);
  background:var(--card);box-shadow:inset 3px 3px 7px var(--dark),inset -3px -3px 7px var(--light);
  white-space:pre-line;
}
.srch-status.ok{color:#3d9a78}
.srch-status.warn{color:#b07d1e}
.srch-status.err{color:var(--danger)}
.key-hint{font-size:11.5px;color:var(--muted);line-height:1.6}
.key-hint.ok{color:#3d9a78}
.key-hint.warn{color:#b07d1e}

/* ---------- add food form ---------- */
.add-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{padding:10px 12px;font-size:14px;width:100%}
.field.full{grid-column:1/-1}
.kcal-preview{padding:12px 15px;border-radius:14px;font-size:13px;color:var(--muted);background:var(--card);box-shadow:inset 3px 3px 7px var(--dark),inset -3px -3px 7px var(--light)}
.kcal-preview b{color:var(--k);font-size:15px}
.form-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* ---------- 每日记录日历 ---------- */
.cal-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-nav-btn{
  width:38px;height:38px;border:none;border-radius:13px;cursor:pointer;background:var(--card);
  color:var(--accent);font-size:18px;font-weight:800;line-height:1;
  box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light);transition:all .12s;
}
.cal-nav-btn:active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light)}
.cal-nav-btn[disabled]{opacity:.35;cursor:default}
.cal-title{font-size:17px;font-weight:800;min-width:126px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;min-width:0}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cal-cell{
  position:relative;border-radius:16px;background:var(--card);padding:9px 9px 8px;min-height:78px;min-width:0;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);
}
.cal-cell.blank{box-shadow:none;background:transparent;min-height:78px}
.cal-cell.future{opacity:.42}
.cal-cell.today{box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light),0 0 0 2px rgba(79,147,208,.45)}
.cal-cell.go{background:linear-gradient(180deg,rgba(108,196,161,.13),rgba(108,196,161,0) 62%),var(--card)}
.cal-cell.no{background:linear-gradient(180deg,rgba(231,127,127,.13),rgba(231,127,127,0) 62%),var(--card)}
.cal-date{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal-cell.today .cal-date{color:var(--accent)}
.cal-tone{position:absolute;top:9px;right:9px;width:11px;height:11px;border-radius:50%;background:var(--dark)}
.cal-cell.go .cal-tone{background:var(--accent2);box-shadow:0 0 0 3px rgba(108,196,161,.2)}
.cal-cell.no .cal-tone{background:var(--danger);box-shadow:0 0 0 3px rgba(231,127,127,.18)}
.cal-kcal{font-size:15.5px;font-weight:800;color:var(--text);line-height:1.1;letter-spacing:-.02em}
.cal-cell.blank .cal-kcal,.cal-cell.future .cal-kcal{color:var(--muted)}
.cal-hint{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.go .cal-hint{color:#3d9a78}
.cal-cell.no .cal-hint{color:var(--danger)}

/* ---------- modal / toast ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(48,58,74,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.modal-overlay.open{display:flex}
.modal{width:min(680px,94vw);max-height:88vh;overflow:auto}
.modal h3{margin-bottom:8px;font-size:18px}
.modal .modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.data-row{margin-top:16px;padding-top:14px;border-top:1px solid rgba(59,68,83,.08)}
.data-row-title{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.data-row-actions{display:flex;gap:9px;flex-wrap:wrap}
.target-block{padding:15px;border-radius:18px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}
.target-block.current{box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light),0 0 0 2px rgba(79,147,208,.3)}
.target-block-title{font-weight:800;font-size:14px;margin-bottom:10px;color:var(--accent)}
.target-line-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0}
.target-line-row b{color:var(--text)}
.weight-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);margin-bottom:6px}
.weight-field label{font-size:13px;font-weight:700;color:var(--muted)}
.weight-field input{width:110px;padding:9px 10px;text-align:center;font-size:15px}
.mult-editor{padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);margin-bottom:14px}
.mult-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.mult-title .muted{font-weight:400;font-size:11.5px}
.mult-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 0}
.mult-row + .mult-row{border-top:1px solid rgba(59,68,83,.08)}
.mult-label{font-size:13px;font-weight:700;color:var(--accent);min-width:52px}
.mult-row label{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.mult-input{width:74px;padding:8px 6px;text-align:center;font-size:14px;-moz-appearance:textfield}
.mult-input::-webkit-inner-spin-button,.mult-input::-webkit-outer-spin-button{-webkit-appearance:none}
.mult-actions{margin-top:9px;display:flex;flex-wrap:wrap;gap:9px}
.food-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.food-detail-grid.single{grid-template-columns:1fr}
.food-detail-box{padding:13px 15px;border-radius:16px;background:var(--card);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}
.food-detail-box .fd-title{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.food-detail-box .fd-val{font-size:13px;font-weight:700;color:var(--text);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%) translateY(24px);background:var(--text);color:#f4f7fb;padding:12px 22px;border-radius:16px;font-size:14px;box-shadow:0 10px 26px rgba(40,50,65,.35);opacity:0;transition:all .28s;z-index:100;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 简化悬浮缺口窗口（新拟态 · 顶部） ---------- */
.float-summary{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-18px);
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  max-width:92vw;padding:10px 18px;border-radius:18px;z-index:45;pointer-events:none;
  background:var(--card);color:var(--text);font-size:12px;font-weight:600;
  box-shadow:8px 8px 16px var(--dark),-8px -8px 16px var(--light);
  opacity:0;transition:opacity .25s,transform .25s;
}
.float-summary.show{opacity:1;transform:translateX(-50%) translateY(0)}
.float-summary .fs-k{color:var(--k);font-size:14px}
.float-summary .fs-gap{color:var(--accent2);font-weight:700}
.float-summary .fs-gap.over{color:var(--danger)}
.float-summary .fs-m{color:var(--muted)}
.float-summary .fs-m b{color:var(--text)}
.float-summary .fs-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
@media (min-width:1001px){ .float-summary{display:none} }

@media (max-width:1000px){
  .library-layout{gap:18px}
  .today-layout{display:flex;flex-direction:column}
  .today-layout{align-items:stretch}
  .today-layout>*{width:100%;min-width:0}
  .overview{order:-1;position:static;padding:16px 18px}
  .meal-card{width:100%}
  .kcal-num{font-size:34px}
  .metric-row{padding:8px 11px}
  .metric-top{font-size:12px;margin-bottom:5px}
}
@media (max-width:640px){
  .app-header{justify-content:center;text-align:center}
  .daybox{text-align:center}
  .header-actions{justify-content:center}
  .search{width:100%}
  .add-form{grid-template-columns:1fr}
  .target-grid{grid-template-columns:1fr}
  .food-detail-grid{grid-template-columns:1fr}
  .toolbar>*{flex:1 1 auto}
  .toolbar .search{flex:1 1 100%}
  .main-nav{max-width:100%}
  .main-nav button{padding:10px 4px;font-size:13px}
  .card{padding:16px}
  th{font-size:11px}
  td{font-size:12.5px}
  .col-c,.col-p,.col-f{display:none}
  .qty-input{width:64px;padding:9px 4px;font-size:15px}
  .serving-input{width:58px;padding:9px 4px;font-size:14px}
  .step{width:36px;height:36px;font-size:19px}
  .modal-actions button{flex:1}
  .cal-grid{gap:6px}
  .cal-cell{min-height:60px;padding:7px 6px 6px;border-radius:13px}
  .cal-cell.blank{min-height:60px}
  .cal-kcal{font-size:13px}
  .cal-hint{font-size:9.5px}
  .cal-wd{font-size:11px}
  .cal-tone{width:9px;height:9px;top:7px;right:7px}
  .cal-title{font-size:15px;min-width:100px}
  .cal-nav-btn{width:34px;height:34px}
}
/* 更窄的手机（iPhone 常见 375~430px）：进一步压缩日历格子，避免把卡片撑破 */
@media (max-width:430px){
  .wrap{padding:0 12px 60px}
  .card{padding:14px}
  .cal-grid{gap:4px}
  .cal-cell{min-height:54px;padding:6px 4px 5px;border-radius:11px}
  .cal-cell.blank{min-height:54px}
  .cal-kcal{font-size:12px}
  .cal-hint{font-size:8.5px}
  .cal-date{font-size:11px}
  .cal-tone{width:8px;height:8px;top:6px;right:6px}
  .cal-wd{font-size:10.5px}
  .day-label{font-size:clamp(20px,5.4vw,23px)}
  .day-week{font-size:11.5px;padding:5px 10px}
  .manual-add{gap:5px;padding:8px 10px}
  .manual-add label{font-size:11.5px;gap:3px}
  .manual-add input{font-size:13px;padding:7px 1px}
  .manual-add .btn{padding:8px 11px;font-size:12.5px}
  /* 食物明细表：把输入框和按钮收窄，避免小屏要横向拖动 */
  th{padding:8px 5px}
  td{padding:7px 5px}
  .fname{max-width:120px}
  .serving-input{width:58px}
  .qty-input{width:52px}
  .qty{gap:3px}
  .step{width:26px;height:26px;border-radius:9px;font-size:15px}
}
/* 极窄（老的 320px 屏）：再压一档，保证 4 位数热量不被裁 */
@media (max-width:370px){
  .cal-grid{gap:3px}
  .cal-cell{padding:5px 3px 4px;border-radius:10px}
  .cal-kcal{font-size:11px}
  .cal-hint{font-size:8px}
  .cal-date{font-size:10.5px}
  .cal-wd{font-size:10px}
  .card{padding:12px}
  .wrap{padding:0 10px 60px}
  .serving-input{width:52px}
  .qty-input{width:46px}
  .step{width:24px;height:24px;font-size:14px}
  .fname{max-width:96px}
  .day-label{font-size:20px}
  .day-week{font-size:11px;padding:5px 9px}
  .manual-add{gap:4px;padding:8px 9px}
  .manual-add-title{font-size:14px}
  .manual-add label{font-size:11px;gap:2px}
  .manual-add input{font-size:12.5px}
  .manual-add .btn{padding:7px 9px;font-size:12px}
}
</style>
</head>
<body>

<header class="app-header card">
  <div class="daybox">
    <div class="day-line">
      <span class="day-label" id="dayLabel"></span>
      <span class="day-week" id="dayWeek"></span>
    </div>
  </div>
  <div class="header-actions">
    <div class="seg" id="dayTypeSeg">
      <button type="button" data-type="train">训练日</button>
      <button type="button" data-type="rest">休息日</button>
    </div>
    <button class="btn" id="editTargetsBtn" type="button">⚙️ 目标</button>
  </div>
</header>

<nav class="main-nav">
  <button class="active" data-tab="today" type="button">📝 今日记录</button>
  <button data-tab="library" type="button">🍎 食物库</button>
  <button data-tab="trend" type="button">📅 每日记录</button>
</nav>

<main class="wrap">
  <!-- ================= 今日记录 ================= -->
  <section id="tab-today" class="tab-panel active">
    <div class="today-layout">
      <div class="card meal-card">
        <div class="card-title">🍱 记录今日饮食</div>
        <div class="toolbar">
          <input class="search" id="mealSearch" placeholder="🔍 搜索食物…">
          <div class="cat-filter" id="mealCatFilter">
            <button class="cat-filter-btn active" data-cat="碳水类" type="button">碳水</button>
            <button class="cat-filter-btn" data-cat="蛋白类" type="button">蛋白</button>
            <button class="cat-filter-btn" data-cat="其他" type="button">其他</button>
          </div>
        </div>
        <div class="manual-add">
          <span class="manual-add-title">✍️</span>
          <label><span class="ma-t">碳水</span><input id="mC" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0"></label>
          <label><span class="ma-t">蛋白</span><input id="mP" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0"></label>
          <label><span class="ma-t">脂肪</span><input id="mF" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0"></label>
          <button class="btn btn-sm btn-primary" id="mAddBtn" type="button">加入</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-food">食物</th>
                <th class="col-serving">一份克数(g)</th>
                <th class="col-c">碳水(g)</th>
                <th class="col-p">蛋白(g)</th>
                <th class="col-f">脂肪(g)</th>
                <th class="col-qty">份数</th>
              </tr>
            </thead>
            <tbody id="mealBody"></tbody>
          </table>
        </div>
      </div>

      <aside class="card overview">
        <div class="card-title">📊 今日总摄入表</div>
        <div class="kcal-hero">
          <div class="kcal-num" id="ovKcal">0</div>
          <div class="kcal-sub"><span id="ovKcalGap">还差 0 kcal</span> · 目标 <span id="ovKcalTarget">0</span></div>
          <div class="bar"><div class="bar-fill fill-k" id="ovKcalBar"></div></div>
        </div>
        <div class="metric-list" id="metricList"></div>
      </aside>
    </div>
  </section>

  <!-- ================= 食物库 ================= -->
  <section id="tab-library" class="tab-panel">
    <div class="library-layout">
      <!-- 联网查询每100g营养 -->
      <div class="card srch-card">
        <div class="card-title">🔍 联网查营养</div>
        <div class="srch-bar">
          <input class="search srch-input" id="aiQueryInput" placeholder="输入食物名称，如：红烧肉、无糖酸奶、麦当劳巨无霸">
          <button class="btn btn-primary" id="aiQueryBtn" type="button">AI 一键查询</button>
        </div>
        <div class="srch-bar srch-bar-2">
          <button class="btn btn-sm" id="aiPhotoBtn" type="button">📷 拍成分表</button>
          <button class="btn btn-sm" id="aiDishBtn" type="button">🍽 拍食物估算</button>
          <button class="btn btn-sm btn-ghost" id="aiSettingsBtn" type="button">⚙️ 设置</button>
          <input type="file" id="aiPhotoFile" accept="image/*" capture="environment" hidden>
        </div>
        <div class="dish-panel hidden" id="dishPanel">
          <div class="dish-name" id="dishName"></div>
          <div class="dish-nums" id="dishNums"></div>
          <div class="dish-portion">
            <span class="dish-portion-title">份量</span>
            <button class="dish-g" data-g="150" type="button">小份 150g</button>
            <button class="dish-g" data-g="250" type="button">中份 250g</button>
            <button class="dish-g" data-g="400" type="button">大份 400g</button>
          </div>
          <div class="dish-actions">
            <button class="btn btn-sm btn-primary" id="dishAddBtn" type="button">✓ 按这个份量加到今天</button>
            <button class="btn btn-sm" id="dishCloseBtn" type="button">关闭</button>
          </div>
        </div>
        <div class="srch-status hidden" id="aiStatus"></div>
      </div>

      <div class="card add-card">
        <form id="addFoodForm" class="add-form">
          <label class="field"><span>分类</span><select id="nfCat">
            <option value="碳水类">碳水类</option>
            <option value="蛋白类">蛋白类</option>
            <option value="其他">其他</option>
          </select></label>
          <label class="field"><span>每份规格（g）</span><input id="nfServing" type="number" min="1" step="1" value="100"></label>
          <label class="field"><span>每100g 碳水（g）</span><input id="nfC" type="number" min="0" step="0.1" value="0"></label>
          <label class="field"><span>每100g 蛋白质（g）</span><input id="nfP" type="number" min="0" step="0.1" value="0"></label>
          <label class="field"><span>每100g 脂肪（g）</span><input id="nfF" type="number" min="0" step="0.1" value="0"></label>
          <div class="field full kcal-preview">每100g 热量：<b id="nfKcal">0</b> kcal</div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit" id="addFoodBtn">添加到食物清单</button>
            <button class="btn hidden" type="button" id="cancelEditBtn">取消编辑</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= 每日记录（日历） ================= -->
  <section id="tab-trend" class="tab-panel">
    <div class="card">
      <div class="cal-head">
        <div class="card-title" style="margin-bottom:0">📅 每日饮食记录</div>
        <div class="cal-nav">
          <button class="cal-nav-btn" id="calPrev" type="button" aria-label="上一个月">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="cal-nav-btn" id="calNext" type="button" aria-label="下一个月">›</button>
          <button class="btn btn-sm" id="calTodayBtn" type="button">回到本月</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </section>
</main>

<!-- 目标弹窗 -->
<div class="modal-overlay" id="targetModal">
  <div class="modal card">
    <h3>调整体重与每日目标</h3>
    <div class="weight-field">
      <label for="targetWeightInput">当前体重（kg）</label>
      <input id="targetWeightInput" type="number" min="20" max="300" step="0.1">
      <label for="targetFatInput" style="margin-left:8px">脂肪目标（g）</label>
      <input id="targetFatInput" type="number" min="0" step="1" style="width:90px">
    </div>
    <div class="mult-editor">
      <div class="mult-title">每日目标系数</div>
      <div class="mult-row">
        <span class="mult-label">训练日</span>
        <label for="multTrainC">碳水 ×<input class="mult-input" id="multTrainC" type="number" min="0.5" max="20" step="0.1" inputmode="decimal"></label>
        <label for="multTrainP">蛋白 ×<input class="mult-input" id="multTrainP" type="number" min="0.2" max="10" step="0.1" inputmode="decimal"></label>
      </div>
      <div class="mult-row">
        <span class="mult-label">休息日</span>
        <label for="multRestC">碳水 ×<input class="mult-input" id="multRestC" type="number" min="0.5" max="20" step="0.1" inputmode="decimal"></label>
        <label for="multRestP">蛋白 ×<input class="mult-input" id="multRestP" type="number" min="0.2" max="10" step="0.1" inputmode="decimal"></label>
      </div>
      <div class="mult-actions">
        <button class="btn btn-sm" id="resetMultBtn" type="button">恢复默认系数（碳 4/3.5 · 蛋 2/1.5）</button>
      </div>
    </div>
    <div class="target-grid" id="targetGrid"></div>
    <div class="data-row">
      <span class="data-row-title">数据</span>
      <div class="data-row-actions">
        <button class="btn btn-sm" id="exportBtn" type="button">⬇️ 导出备份</button>
        <button class="btn btn-sm" id="importBtn" type="button">⬆️ 导入备份</button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn btn-sm hidden" id="restoreHiddenBtn" type="button">↩️ 恢复已移除的食物</button>
        <button class="btn btn-sm btn-danger-ghost" id="resetDataBtn" type="button">重置数据</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelTargetsBtn" type="button">取消</button>
      <button class="btn btn-primary" id="saveTargetsBtn" type="button">保存</button>
    </div>
    <div class="ver-line">版本 <span id="verText"></span></div>
  </div>
</div>

<!-- 食物详情弹窗 -->
<div class="modal-overlay" id="foodModal">
  <div class="modal card">
    <h3 id="foodModalTitle"></h3>
    <p class="modal-sub" id="foodModalSub"></p>
    <div class="food-detail-grid single" id="foodModalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="foodModalEdit" type="button">✏️ 编辑营养数据</button>
      <button class="btn btn-danger-ghost" id="foodModalDelete" type="button">🗑 删除这个食物</button>
      <button class="btn" id="foodModalClose" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 食物编辑弹窗 -->
<div class="modal-overlay" id="editFoodModal">
  <div class="modal card">
    <h3 id="editFoodTitle">编辑食物</h3>
    <form id="editFoodForm" class="add-form" style="margin-top:14px">
      <label class="field full"><span>食物名称</span><input id="efName" required></label>
      <label class="field"><span>分类</span><select id="efCat">
        <option value="碳水类">碳水类</option>
        <option value="蛋白类">蛋白类</option>
        <option value="其他">其他</option>
      </select></label>
      <label class="field"><span>每份规格（g）</span><input id="efServing" type="number" min="1" step="1"></label>
      <label class="field"><span>每100g 碳水（g）</span><input id="efC" type="number" min="0" step="0.1"></label>
      <label class="field"><span>每100g 蛋白质（g）</span><input id="efP" type="number" min="0" step="0.1"></label>
      <label class="field"><span>每100g 脂肪（g）</span><input id="efF" type="number" min="0" step="0.1"></label>
      <div class="field full kcal-preview">每100g 热量：<b id="efKcal">0</b> kcal</div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">保存修改</button>
        <button class="btn btn-danger-ghost hidden" id="efRestoreBtn" type="button">恢复默认</button>
        <button class="btn" id="efCancelBtn" type="button">取消</button>
      </div>
    </form>
  </div>
</div>

<!-- AI 设置弹窗 -->
<div class="modal-overlay" id="aiSettingsModal">
  <div class="modal card">
    <h3>AI 查询设置</h3>
    <p class="modal-sub">key 只存在本机浏览器，不会上传到任何服务器。</p>
    <form id="aiSettingsForm" class="add-form">
      <label class="field full"><span>服务商</span><select id="aiProvider">
        <option value="deepseek">DeepSeek（推荐，便宜）</option>
        <option value="zhipu">智谱 GLM（glm-4-flash 免费）</option>
        <option value="kimi">Kimi / 月之暗面</option>
        <option value="siliconflow">硅基流动 SiliconFlow</option>
        <option value="dashscope">通义千问 DashScope</option>
        <option value="custom">自定义（OpenAI 兼容接口）</option>
      </select></label>
      <label class="field full"><span>接口地址</span><input id="aiBaseUrl" placeholder="https://api.deepseek.com/chat/completions"></label>
      <label class="field"><span>模型名</span><input id="aiModel" placeholder="deepseek-chat"></label>
      <label class="field"><span>视觉模型（拍照识别用）</span><input id="aiVModel" placeholder="deepseek-v4-flash-vision-exp"></label>
      <label class="field"><span>API Key</span><input id="aiKey" type="password" placeholder="sk-..."></label>
      <div class="field full"><div class="key-hint" id="aiKeyHint">建议用 DeepSeek 控制台的「复制」按钮，粘贴时别漏字符。</div></div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">保存</button>
        <button class="btn btn-danger-ghost" type="button" id="aiClearKeyBtn">清除 key</button>
        <button class="btn" type="button" id="aiSettingsCancel">取消</button>
      </div>
    </form>
  </div>
</div>

<div class="float-summary" id="floatSummary"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

/* 默认目标系数：碳水/蛋白 g per kg 体重。用户可在「目标」弹窗里自己改，
   改后的值存在 settings.mult = { train:{c,p}, rest:{c,p} }，下面这组永远作为默认值与兜底。 */
const MULTIPLIERS = {
  train: { label: '训练日', c: 4, p: 2 },
  rest: { label: '休息日', c: 3.5, p: 1.5 }
};
const MULT_RANGE = { c: { min: 0.5, max: 20 }, p: { min: 0.2, max: 10 } };
function clampMult(v, dflt, lo, hi){
  const n = Number(v);
  if (!isFinite(n) || n <= 0) return dflt;
  return Math.round(Math.min(hi, Math.max(lo, n)) * 100) / 100;
}
function getMultipliers(){
  const saved = (settings && settings.mult) || {};
  const out = {};
  Object.keys(MULTIPLIERS).forEach(k => {
    const d = MULTIPLIERS[k], u = saved[k] || {};
    out[k] = {
      label: d.label,
      c: clampMult(u.c, d.c, MULT_RANGE.c.min, MULT_RANGE.c.max),
      p: clampMult(u.p, d.p, MULT_RANGE.p.min, MULT_RANGE.p.max)
    };
  });
  return out;
}

/* ================= 工具函数 ================= */
function pad2(n){ return String(n).padStart(2, '0'); }
function dietDateKey(d){
  const x = d ? new Date(d) : new Date();
  if (x.getHours() < 4) x.setDate(x.getDate() - 1);
  return dateKeyOf(x);
}
function dateKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fmtDateCN(key){
  const p = fmtDateParts(key);
  return p.date + ' · ' + p.week;
}
function fmtDateParts(key){
  const [y, m, dd] = key.split('-').map(Number);
  const d = new Date(y, m - 1, dd);
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return { date: m + '月' + dd + '日', week: '周' + wd };
}
function fmtNum(n, d){
  if (d == null) d = 1;
  if (n == null || !isFinite(n)) n = 0;
  const p = Math.pow(10, d);
  return (Math.round(n * p) / p).toFixed(d);
}
function fmtK(n){ return String(Math.round(n || 0)); }
function trimNum(n){ return String(Math.round((n || 0) * 10000) / 10000); }
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function catClass(cat){ return cat === '碳水类' ? 'carb' : cat === '蛋白类' ? 'protein' : 'other'; }
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================= 目标计算 ================= */
function normalizeSettings(){
  settings = Object.assign({ dayType: 'train', weight: 60, fat: 60 }, settings || {});
  if (!settings.mult || typeof settings.mult !== 'object') settings.mult = {};
  const eff = getMultipliers();
  Object.keys(MULTIPLIERS).forEach(k => { settings.mult[k] = { c: eff[k].c, p: eff[k].p }; });
  if (settings.dayType !== 'train' && settings.dayType !== 'rest') settings.dayType = 'train';
  const w = Number(settings.weight), f = Number(settings.fat);
  settings.weight = (isFinite(w) && w > 0) ? w : 60;
  settings.fat = (isFinite(f) && f >= 0) ? f : 60;
}
function getTargets(){
  const w = Number(settings.weight) || 60;
  const ms = getMultipliers();
  const m = ms[settings.dayType] || ms.train;
  const c = Math.round(w * m.c);
  const p = Math.round(w * m.p);
  const f = Number(settings.fat) || 60;
  return { label: m.label, c: c, p: p, f: f, kcal: c * 4 + p * 4 + f * 9 };
}

/* ================= 食物 ================= */
function normalizeCustomFoods(){
  customFoods = (Array.isArray(customFoods) ? customFoods : []).filter(f => f && f.id && f.name).map(f => {
    if (!f.per100) f.per100 = { c: 0, p: 0, f: 0, kcal: 0 };
    if (!f.serving) f.serving = 100;
    f.perServing = calcPerServing(f.per100, f.serving);
    return f;
  });
}
function calcPerServing(per100, serving){
  const s = serving / 100;
  return {
    c: Math.round(per100.c * s * 1000) / 1000,
    p: Math.round(per100.p * s * 1000) / 1000,
    f: Math.round(per100.f * s * 1000) / 1000,
    kcal: Math.round(per100.kcal * s * 1000) / 1000
  };
}
function foodList(){
  const list = BUILTIN_FOODS.filter(base => hiddenFoods.indexOf(base.id) < 0).map(base => {
    const ov = overrides[base.id] || {};
    const per100 = Object.assign({}, base.per100, ov.per100 || {});
    const serving = ov.serving != null ? ov.serving : base.serving;
    return {
      id: base.id,
      name: ov.name || base.name,
      cat: ov.cat || base.cat,
      serving: serving,
      per100: per100,
      perServing: calcPerServing(per100, serving),
      builtin: true,
      overridden: !!overrides[base.id]
    };
  });
  customFoods.forEach(f => list.push(Object.assign({}, f, { builtin: false, overridden: false })));
  return list;
}
function foodMap(){
  const m = new Map();
  foodList().forEach(f => m.set(f.id, f));
  return m;
}

/* ================= 记录 ================= */
function emptyRec(){ return { entries: {}, manual: [], checked: false }; }
function normalizeRecords(){
  Object.keys(records).forEach(k => {
    const rec = records[k];
    if (!rec || typeof rec !== 'object') { records[k] = emptyRec(); return; }
    if (rec.meals && !rec.entries) {
      const e = {};
      ['早', '中', '晚', '加餐'].forEach(m => Object.assign(e, rec.meals[m] || {}));
      rec.entries = e;
      delete rec.meals;
    }
    if (!rec.entries) rec.entries = {};
    if (!Array.isArray(rec.manual)) rec.manual = [];
  });
}
function getRec(){
  if (!records[currentDayKey]) records[currentDayKey] = emptyRec();
  const rec = records[currentDayKey];
  if (!Array.isArray(rec.manual)) rec.manual = [];
  return rec;
}
function calcTotals(key){
  const k = key || currentDayKey;
  const rec = records[k] || emptyRec();
  const fm = foodMap();
  const total = { c: 0, p: 0, f: 0, kcal: 0 };
  Object.entries(rec.entries || {}).forEach(([fid, count]) => {
    const f = fm.get(fid);
    if (!f || !count) return;
    total.c += f.perServing.c * count;
    total.p += f.perServing.p * count;
    total.f += f.perServing.f * count;
    total.kcal += f.perServing.kcal * count;
  });
  (rec.manual || []).forEach(m => {                 // 手填的营养素直接累加
    total.c += Number(m.c) || 0;
    total.p += Number(m.p) || 0;
    total.f += Number(m.f) || 0;
    total.kcal += (Number(m.c) || 0) * 4 + (Number(m.p) || 0) * 4 + (Number(m.f) || 0) * 9;
  });
  return { total };
}
/* 近 30 天里「有几天吃过」——用来把常吃的食物排前面 */
function foodUsage(){
  const since = Date.now() - 30 * 86400000;
  const counts = {};
  Object.keys(records).forEach(k => {
    const t = Date.parse(k + 'T00:00:00');
    if (!isFinite(t) || t < since) return;
    const en = (records[k] || {}).entries || {};
    Object.keys(en).forEach(fid => { if (en[fid] > 0) counts[fid] = (counts[fid] || 0) + 1; });
  });
  return counts;
}
function addManual(){
  const c = parseFloat($('#mC').value) || 0;
  const p = parseFloat($('#mP').value) || 0;
  const f = parseFloat($('#mF').value) || 0;
  if (c <= 0 && p <= 0 && f <= 0){ toast('至少填一个数值'); return; }
  if (c < 0 || p < 0 || f < 0){ toast('数值不能为负'); return; }
  const rec = getRec();
  rec.manual.push({ id: 'm' + Date.now(), c: c, p: p, f: f, note: '' });
  saveAll();
  $('#mC').value = ''; $('#mP').value = ''; $('#mF').value = '';
  renderMealTable();
  renderOverview();
  toast('已加入：碳水 ' + fmtNum(c) + ' / 蛋白 ' + fmtNum(p) + ' / 脂肪 ' + fmtNum(f) + ' g');
}
function removeManual(id){
  const rec = getRec();
  rec.manual = (rec.manual || []).filter(m => m.id !== id);
  saveAll();
  renderMealTable();
  renderOverview();
}
function caloriesForDate(key){
  return calcTotals(key).total.kcal;
}
function weightOnOrBefore(key){
  let best = null, bestKey = null;
  Object.keys(weights).forEach(k => {
    if (k <= key && (bestKey === null || k > bestKey)) { bestKey = k; best = weights[k]; }
  });
  return best != null ? best : settings.weight;
}

/* ================= 渲染：今日总摄入表 ================= */
function renderOverview(){
  const { total } = calcTotals();
  const t = getTargets();
  renderFloatSummary();
  $('#ovKcal').textContent = fmtK(total.kcal);
  $('#ovKcalTarget').textContent = fmtK(t.kcal);

  $('#ovKcalGap').textContent = kgap > 0 ? '还差 ' + fmtK(kgap) + ' kcal' : (kgap < 0 ? '已超出 ' + fmtK(-kgap) + ' kcal' : '刚好达标 🎉');
  $('#ovKcalBar').style.width = Math.min(100, total.kcal / t.kcal * 100) + '%';

  const rows = [
    { key: 'c', label: '碳水', cls: 'fill-c', color: 'var(--c)' },
    { key: 'p', label: '蛋白质', cls: 'fill-p', color: 'var(--p)' },
    { key: 'f', label: '脂肪', cls: 'fill-f', color: 'var(--f)' }
  ];
  $('#metricList').innerHTML = rows.map(r => {
    const intake = total[r.key], target = t[r.key];
    const gap = target - intake;
    const gapTxt = gap > 0 ? '还差 ' + fmtNum(gap) + 'g' : (gap < 0 ? '超出 ' + fmtNum(-gap) + 'g' : '刚好');
    const gapCls = gap < 0 ? 'gap over' : 'gap';

      <div class="metric-top">
        <span class="metric-name"><i style="background:${r.color}"></i>${r.label}</span>
        <span class="metric-vals">目标 <b>${fmtNum(target)}g</b> · 摄入 <b>${fmtNum(intake)}g</b><span class="${gapCls}">${gapTxt}</span></span>
      </div>

function renderFloatSummary(){

  const gapTxt = kgap > 0 ? '还差 ' + fmtK(kgap) : (kgap < 0 ? '超出 ' + fmtK(-kgap) : '达标');
  el.innerHTML = `<span><b class="fs-k">🔥 ${fmtK(total.kcal)}</b><span class="fs-m">/${fmtK(t.kcal)} kcal</span> <span class="fs-gap${kgap < 0 ? ' over' : ''}">${gapTxt}</span></span>

function renderMealTable(){
  const kw = state.search.trim();
  const foods = foodList().filter(f =>
    (state.catFilter === '全部' || f.cat === state.catFilter) &&
    (!kw || f.name.includes(kw))
  );
  const rec = getRec();
  const counts = rec.entries || {};
  let html = '';
  const span = window.matchMedia('(max-width:640px)').matches ? 4 : 6;

  // 手填的营养素（不算份数，直接记克数）
  const manual = rec.manual || [];
  if (manual.length){
    html += `<tr class="cat-head"><td colspan="${span}">✍️ 手填</td></tr>`;
    manual.forEach(m => {
      html += `<tr data-manual="${m.id}">
        <td class="col-food fname">${m.note ? esc(m.note) : '手填营养素'}</td>
        <td class="col-serving">—</td>
        <td class="col-c">${fmtNum(m.c)}</td>
        <td class="col-p">${fmtNum(m.p)}</td>
        <td class="col-f">${fmtNum(m.f)}</td>
        <td class="col-qty"><div class="qty"><button class="step manual-del" data-act="delmanual" type="button">✕</button></div></td>
      </tr>`;
    });
  }

  const usage = foodUsage();                 // 近 30 天吃得多的排前面
  CATS.forEach(cat => {
    const items = foods.filter(f => f.cat === cat);
    if (!items.length) return;
    items.sort((a, b) => (usage[b.id] || 0) - (usage[a.id] || 0));
    html += `<tr class="cat-head"><td colspan="${span}">${cat}</td></tr>`;
    items.forEach(f => {
      const count = counts[f.id] || 0;
      html += `<tr data-fid="${f.id}">
        <td class="col-food fname" data-action="view"><span class="cat-dot ${catClass(f.cat)}"></span>${esc(f.name)}</td>
        <td class="col-serving"><input class="serving-input" type="number" min="1" step="1" value="${fmtNum(f.serving, 0)}" data-fid="${f.id}" data-kind="serving" inputmode="decimal"></td>
        <td class="col-c">${fmtNum(f.perServing.c)}</td>
        <td class="col-p">${fmtNum(f.perServing.p)}</td>
        <td class="col-f">${fmtNum(f.perServing.f)}</td>
        <td class="col-qty"><div class="qty">
          <button class="step" data-act="minus" type="button">−</button>
          <input class="qty-input" type="number" min="0" step="0.1" value="${trimNum(count)}" data-fid="${f.id}" data-kind="count" inputmode="decimal">
          <button class="step" data-act="plus" type="button">+</button>
        </div></td>
      </tr>`;
    });
  });
  $('#mealBody').innerHTML = html || '<tr><td colspan="6" class="empty-td">没有找到匹配的食物</td></tr>';
}

/* ================= 渲染：每日饮食记录（日历） ================= */
const KCAL_TOLERANCE = 200;   // 目标 ±200 kcal 之内算达标（绿灯）
function calMonth(){
  if (state.calYear == null){
    const now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth();
  }
  return { y: state.calYear, m: state.calMonth };
}
function shiftCalMonth(delta){
  const c = calMonth();
  let y = c.y, m = c.m + delta;
  if (m < 0){ m = 11; y--; }
  if (m > 11){ m = 0; y++; }
  state.calYear = y; state.calMonth = m;
  renderCalendar();
}
function resetCalMonth(){
  const now = new Date();
  state.calYear = now.getFullYear();
  state.calMonth = now.getMonth();
  renderCalendar();
}
function renderCalendar(){
  const { y, m } = calMonth();
  const t = getTargets();
  const targetKcal = t.kcal;
  const todayKey = dietDateKey();
  $('#calTitle').textContent = y + ' 年 ' + (m + 1) + ' 月';

  const lead = (new Date(y, m, 1).getDay() + 6) % 7;      // 周一排在第一列
  const days = new Date(y, m + 1, 0).getDate();
  let html = ['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="cal-wd">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) html += '<div class="cal-cell blank"></div>';

  for (let d = 1; d <= days; d++){
    const key = y + '-' + pad2(m + 1) + '-' + pad2(d);
    const rec = records[key];
    const kcal = caloriesForDate(key);
    const has = kcal > 0 || !!(rec && rec.entries && Object.keys(rec.entries).length);
    const isToday = key === todayKey;
    const isFuture = key > todayKey;
    let tone = '', judge = '', gapTxt = '';
    if (has){
      const diff = kcal - targetKcal;
      if (Math.abs(diff) <= KCAL_TOLERANCE){ tone = ' go'; judge = '达标'; }
      else if (diff < 0){ tone = ' no'; judge = '低 ' + fmtK(-diff); }
      else { tone = ' no'; judge = '高 ' + fmtK(diff); }
    }
    const cls = 'cal-cell' + tone + (isToday ? ' today' : '') + (!has && isFuture ? ' future' : '');
    const tip = has
      ? (m + 1) + '月' + d + '日：' + fmtK(kcal) + ' kcal（目标 ' + fmtK(targetKcal) + ' · ' + judge + '）'
      : (m + 1) + '月' + d + '日：' + (isFuture ? '还没到' : '没有记录');
    html += `<div class="${cls}" data-day="${key}" title="${tip}">
      <div class="cal-date">${d}</div>
      <div class="cal-tone"></div>
      <div>
        <div class="cal-kcal">${has ? fmtK(kcal) : '—'}</div>
        <div class="cal-hint">${has ? judge : ''}</div>
      </div>
    </div>`;
  }
  const tail = (7 - (lead + days) % 7) % 7;
  for (let i = 0; i < tail; i++) html += '<div class="cal-cell blank"></div>';
  $('#calGrid').innerHTML = html;
}

function compressImage(file, maxSide, cropRatio){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onerror = function(){ reject(new Error('读取图片失败')); };
    reader.onload = function(){
      const img = new Image();
      img.onerror = function(){ reject(new Error('这张图片无法解析')); };
      img.onload = function(){
        const iw = img.width || 1, ih = img.height || 1;
        // cropRatio：只取中间那块（成分表一般拍在中间），相当于给模型「放大」
        const sw = cropRatio ? Math.round(iw * cropRatio) : iw;
        const sh = cropRatio ? Math.round(ih * cropRatio) : ih;
        const sx = Math.round((iw - sw) / 2), sy = Math.round((ih - sh) / 2);
        const scale = cropRatio
          ? (maxSide / Math.max(sw, sh))                  // 裁剪后放大到 maxSide，相当于给模型「放大看」
          : Math.min(1, maxSide / Math.max(sw, sh));
        const w = Math.max(1, Math.round(sw * scale));
        const h = Math.max(1, Math.round(sh * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.92));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function normalizeDigits(s){
  return String(s == null ? '' : s)

function catByMacros(c, p, f){
  const kc = c * 4, kp = p * 4, kf = f * 9;
  if (kc >= kp && kc >= kf) return '碳水类';
  if (kp >= kf) return '蛋白类';
  return '其他';
}

function parseTranscription(t){
  const s = normalizeDigits(t);
  let name = '';
  const nm = s.match(/(?:名称|品名|食品名)\s*[:：]\s*([^\n]{1,24})/);
  if (nm) name = nm[1].trim().replace(/[（(].*$/, '').trim();
  let c = pickNumByRegex(s, ['碳水化合物', '碳水化物', '碳水', 'carbohydrates?', 'carbs?']);
  let p = pickNumByRegex(s, ['蛋白质', '蛋白', 'proteins?']);
  let f = pickNumByRegex(s, ['脂肪', 'fats?']);
  if (c == null || p == null || f == null) return null;
  // 表里只有「每份」时，按每份克数换算成每100g
  const isPer100 = /每\s*100\s*(g|克|ml|毫升)/i.test(s);
  const isPerServing = /每份|per\s*serving/i.test(s);
  if (!isPer100 && isPerServing){
    const sg = pickNumByRegex(s, ['每份克数', '每份重', '净含量']);
    if (sg && sg > 0 && sg !== 100){
      const k = 100 / sg;
      c = c * k; p = p * k; f = f * k;
    }
  }
  const r2 = x => Math.round(x * 100) / 100;
  c = r2(c); p = r2(p); f = r2(f);
  return { name: name, cat: catByMacros(c, p, f), c: c, p: p, f: f };
}

async function visionCall(dataUrl, prompt, maxTokens){

    body: JSON.stringify({

        { type: 'image_url', image_url: { url: dataUrl } }

    return { error: { status: res.status, msg: msg } };
  }
  let content = txt;
  try { content = JSON.parse(txt).choices[0].message.content; } catch(e){}
  return { content: String(content || '') };
}

function pickNumByRegex(s, labels){

  // 没给分类时，按三大营养素占比自动判断
  if (!cat) cat = catByMacros(c, p, f);
  return { name: name || fallbackName || '', cat: cat, c: c, p: p, f: f };
}

  const card = document.querySelector('.add-card');
  if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return true;
}
function useParsedAnswer(raw, fromQuery){
  const d = parseFoodAnswer(raw, fromQuery);
  if (!d){
    setAiStatus('❌ AI 返回的内容里没找到「碳水 / 蛋白质 / 脂肪」三个数值，可以再点一次「AI 一键查询」重试。', 'err');
    return false;
  }
  fillAddForm(d);
  setAiStatus('', 'ok');   // 成功就不显示提示，直接看下面的表单
  return true;
}
async function queryAiFood(){
  const name = $('#aiQueryInput').value.trim();
  if (!name){ setAiStatus('请先输入食物名称。', 'warn'); $('#aiQueryInput').focus(); return; }
  const cfg = aiConf();
  if (!cfg.key || !cfg.url){
    setAiStatus('还没填 AI key，所以用不了「AI 一键查询」。点「⚙️ 设置」把 DeepSeek 的 key 填进去保存即可。', 'warn');
    openAiSettings();
    return;
  }
  setAiStatus('正在查询「' + name + '」…');
  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({
        model: cfg.model,
        messages: [{ role: 'user', content: buildFoodPrompt(name) }],
        temperature: 0.2,
        max_tokens: 300
      })
    });
    const txt = await res.text();
    if (!res.ok){
      let msg = txt.slice(0, 150);
      try { const j = JSON.parse(txt); msg = (j.error && (j.error.message || j.error.code)) || j.message || msg; } catch(e){}
      if (res.status === 401 || res.status === 403){
        setAiStatus('❌ key 无效（HTTP ' + res.status + '）：' + msg + '\n' +
          '请到 DeepSeek 控制台（platform.deepseek.com → API keys）：\n' +
          '1) 确认 key 还在（有没有被删掉）\n' +
          '2) 点「复制」重新复制一次，粘贴后在设置里看「已识别 XX 个字符」（正常 sk- 开头、35 位左右）\n' +
          '3) 重新保存后再查一次', 'err');
        return;
      }
      if (res.status === 402){
        setAiStatus('❌ 余额不足（HTTP 402）：' + msg + '\n去 platform.deepseek.com → 充值 充一点就能用（每次查询不到一分钱）。', 'err');
        return;
      }
      if (res.status === 404){
        setAiStatus('❌ 接口地址不对（HTTP 404）：' + msg + '\n请在「⚙️ 设置」里把接口地址恢复为 https://api.deepseek.com/chat/completions', 'err');
        return;
      }
      setAiStatus('❌ 查询失败（HTTP ' + res.status + '）：' + msg, 'err');
      return;
    }
    let content = txt;
    try { content = JSON.parse(txt).choices[0].message.content; } catch(e){}
    if (!useParsedAnswer(content, name)){
      setAiStatus('❌ AI 返回的内容没能解析出营养数据，再点一次试试；如果一直这样，可以在「⚙️ 设置」里换个服务商。\n（原始返回：' + String(content).slice(0, 120).replace(/\s+/g, ' ') + '）', 'err');
    }
  } catch(e){
    const rt = await reachTest(cfg.url);
    const host = hostName(cfg.url);
    const hint = rt.ok
      ? '接口地址本身能连通，但这次请求被浏览器拦下了。多半是「接口地址 / 模型名」填错，或该接口不允许网页直连。'
      : '手机网络访问不了 ' + host + '。最常见原因：手机开着 VPN / 加速器 / 代理（DeepSeek 会拒绝境外 IP），或当前 Wi-Fi / 流量限制。换一个网络再试通常就好了。';
    setAiStatus('❌ 请求失败：' + ((e && (e.message || e.name)) || '未知错误') + '\n' + hint, 'err');
  }
}

const MULT_FIELDS = { train: { c: 'multTrainC', p: 'multTrainP' }, rest: { c: 'multRestC', p: 'multRestP' } };
function modalWeight(){
  const w = parseFloat($('#targetWeightInput').value);

}
function modalFat(){
  const f = parseFloat($('#targetFatInput').value);
  return (isFinite(f) && f >= 0) ? Math.round(f) : (Number(settings.fat) || 60);
}
function readModalMult(){
  const out = {};
  Object.keys(MULT_FIELDS).forEach(k => {
    const d = MULTIPLIERS[k];
    const c = parseFloat($('#' + MULT_FIELDS[k].c).value);
    const p = parseFloat($('#' + MULT_FIELDS[k].p).value);
    out[k] = { c: (isFinite(c) && c > 0) ? c : d.c, p: (isFinite(p) && p > 0) ? p : d.p };
  });
  return out;
}
function renderTargetPreview(){
  const w = modalWeight(), f = modalFat(), ms = readModalMult();
  $('#targetGrid').innerHTML = Object.keys(MULTIPLIERS).map(k => {
    const d = MULTIPLIERS[k], m = ms[k];
    const c = Math.round(w * m.c), p = Math.round(w * m.p);
    const kcal = c * 4 + p * 4 + f * 9;
    return `<div class="target-block${k === settings.dayType ? ' current' : ''}">
      <div class="target-block-title">${d.label}（碳水 ×${trimNum(m.c)} · 蛋白 ×${trimNum(m.p)}）</div>
      <div class="target-line-row"><span>碳水目标</span><b>${c} g</b></div>
      <div class="target-line-row"><span>蛋白质目标</span><b>${p} g</b></div>
      <div class="target-line-row"><span>脂肪目标</span><b>${f} g</b></div>
      <div class="target-line-row"><span>热量目标</span><b>${kcal} kcal</b></div>
    </div>`;
  }).join('');
}

$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('bad');
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      customFoods = Array.isArray(data.foods) ? data.foods : [];
      overrides = data.overrides && typeof data.overrides === 'object' ? data.overrides : {};
      records = data.records && typeof data.records === 'object' ? data.records : {};
      weights = data.weights && typeof data.weights === 'object' ? data.weights : {};
      hiddenFoods = Array.isArray(data.hidden) ? data.hidden : [];
      settings = Object.assign({ dayType: 'train', weight: 60, fat: 60 }, data.settings || {});
      normalizeSettings();
      normalizeCustomFoods();
      normalizeRecords();
      saveAll();
      renderAll();
      syncHiddenBtn();
      toast('导入成功');
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

if (window.matchMedia('(max-width:1000px)').matches && 'IntersectionObserver' in window){
  const mealCard = document.querySelector('.meal-card');
  const overviewCard = document.querySelector('.overview');
  if (mealCard && overviewCard){
    let mealVisible = false;
    let overviewVisible = false;
    new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.target === mealCard) mealVisible = en.isIntersecting;
        if (en.target === overviewCard) overviewVisible = en.isIntersecting;
      });
      const el = $('#floatSummary');
      if (el) el.classList.toggle('show', mealVisible && !overviewVisible);
    }, { threshold: 0.05 }).observe(mealCard);
    new IntersectionObserver(entries => {
      entries.forEach(en => { overviewVisible = en.isIntersecting; });
      const el = $('#floatSummary');
      if (el) el.classList.toggle('show', mealVisible && !overviewVisible);
    }, { threshold: 0.05 }).observe(overviewCard);
  }
}
if ('serviceWorker' in navigator){
  // GitHub Pages 会给 html/sw.js 加 10 分钟强缓存，所以：
  // 1) updateViaCache:'none' → 每次都跳过缓存去检查 sw.js 有没有新版
  // 2) 新 SW 接管页面时自动刷新一次，保证你看到的永远是最新版
  let reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadedForUpdate) return;
    reloadedForUpdate = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
    if (navigator.serviceWorker.controller) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  });
}
